<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Streamkeys</title>
  <link rel="stylesheet" href="/css/material.min.css">
  <link rel="stylesheet" href="/css/popup.css">
</head>

<body>
  <div class="header">
    <a href="http://www.streamkeys.com" target="_blank" tabindex="-1">Streamkeys</a>
  </div>

  <div id="player">
    <!-- Content will be populated by popup-mv3.js -->
  </div>

  <div class="options">
    <button id="options-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Options
    </button>
    <button id="help-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Help
    </button>
    <button id="donate-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Donate
    </button>
  </div>

  <script type="text/javascript" src="/js/material.min.js"></script>
  <script type="text/javascript" src="/js/popup/popup-mv3.js"></script>
</body>

</html>
