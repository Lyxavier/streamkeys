<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Streamkeys</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" type="text/css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <link rel="stylesheet" href="/css/popup.css">
</head>

<body>
  <div class="header">
    <a href="http://www.streamkeys.com" target="_blank" tabindex="-1">Streamkeys</a>
  </div>

  <div id="player">
    <div class="no-sites">No music sites open.</div>
    <!-- Enabled tabs will be dynamically inserted here -->
    <!-- Disabled sites toggle and list will be dynamically inserted here -->
  </div>

  <div class="options">
    <button id="options-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Options
    </button>
    <button id="help-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Help
    </button>
    <button id="donate-link" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" tabindex="-1">
      Donate
    </button>
  </div>

  <script type="text/javascript" src="/js/popup/popup-mv3-v2style.js"></script>
</body>

</html>
